   <g id="text_1">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #1764ad" transform="translate(382.7235 128.560775)">实验来源输入</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #1764ad" transform="translate(331.825844 152.473431)">背部 + 采集的前部 activation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #d65b22" transform="translate(819.284938 128.588119)">MAP 来源输入</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #d65b22" transform="translate(758.506344 152.473431)">背部 + 辅助生成的前部 activation</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #24354a" transform="translate(572.728594 228.885641)">激活动力学 + 估计募集</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #24354a" transform="translate(568.06375 252.710798)">两种来源可分别标定参数</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #18847a" transform="translate(191.44925 361.124925)">肌肉几何</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #18847a" transform="translate(142.44925 385.032112)">由预测角度更新肌肉总长</text>
    <!-- $L_{MT,i}(\theta)$ -->
    <g style="fill: #18847a" transform="translate(194.45925 407.692425)">
     <text>
      <tspan x="0" y="-0.25" style="font-style: oblique; font-size: 14px; font-family: 'DejaVu Sans'; fill: #18847a">L</tspan>
      <tspan x="35.833301" y="-0.25" style="font-style: oblique; font-size: 14px; font-family: 'DejaVu Sans'; fill: #18847a">θ</tspan>
      <tspan x="7.799805" y="1.849993" style="font-style: oblique; font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #18847a">M</tspan>
      <tspan x="16.255176" y="1.849993" style="font-style: oblique; font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #18847a">T</tspan>
      <tspan x="27.26582" y="1.849993" style="font-style: oblique; font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #18847a">i</tspan>
      <tspan x="22.241406" y="1.849993" style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #18847a">,</tspan>
      <tspan x="30.371387" y="-0.25" style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #18847a">(</tspan>
      <tspan x="44.39873" y="-0.25" style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #18847a">)</tspan>
     </text>
    </g>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #1764ad" transform="translate(571.23875 361.132581)">两个 Hill + 弹性肌腱</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #1764ad" transform="translate(565.514063 385.059456)">联立纤维 / 肌腱力平衡</text>
    <!-- $F_{T,b},\ F_{T,f}$ -->
    <g style="fill: #1764ad" transform="translate(605.4775 407.412425)">
     <text>
      <tspan x="0" y="-0.796875" style="font-style: oblique; font-size: 14px; font-family: 'DejaVu Sans'; fill: #1764ad">F</tspan>
