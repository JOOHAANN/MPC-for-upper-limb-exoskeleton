     </text>
    </g>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #7952a8" transform="translate(1024.91175 361.152269)">躯干运动平衡</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #7952a8" transform="translate(978.90425 385.011331)">Hill + 重力 + 阻尼 + 软限位</text>
    <!-- $\theta,\ \omega$ -->
    <g style="fill: #7952a8" transform="translate(1050.88175 408.532425)">
