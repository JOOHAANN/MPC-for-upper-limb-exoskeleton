    </g>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #79879a" transform="translate(1026.133391 221.057448)">已知负载 m(t)</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #79879a" transform="translate(1004.493469 242.776589)">共享的 M, L1, L2, phi</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #79879a" transform="translate(1014.91175 265.616979)">关节阻尼与软限位</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #18847a" transform="translate(165.099 498.141816)">预测角度更新肌肉几何</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #18847a" transform="translate(177.099 517.3308)">同一步内联立求解</text>
   </g>
   <g id="text_10">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei'; fill: #24354a" transform="translate(643.2465 545.413862)">输出</text>
    <text style="font-size: 15px; font-family: 'Microsoft YaHei'; fill: #24354a" transform="translate(580.041422 570.20019)">净 Hill torque 和 theta</text>
   </g>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 25px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #24354a" x="58.32" y="38.88" transform="rotate(-0 58.32 38.88)">同一 Hill 系统如何产生 torque 与 theta</text>
  </g>
  <g id="text_12">
   <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #79879a" x="58.32" y="71.28" transform="rotate(-0 58.32 71.28)">每次运行选择一种输入来源；模型形式一致</text>
  </g>
  <g id="text_13">
   <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #79879a" transform="translate(64.8 593.389297)">reference 用于训练与评价；只在开始时提供 theta0、omega0。</text>
   <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #79879a" transform="translate(64.8 615.6)">预测过程中不读取后续 reference，不按它反算 torque。</text>
  </g>
