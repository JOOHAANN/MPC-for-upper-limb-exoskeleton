    <text style="font-size: 14px; font-family: 'Arial'; fill: #18847a" transform="translate(179.715414 432.94625)">Muscle geometry</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #18847a" transform="translate(132.760727 454.053437)">MT lengths from predicted angle</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1764ad" transform="translate(540.666417 433.028281)">Two Hill + compliant tendons</text>
    <text style="font-size: 14px; font-family: 'Arial'; fill: #1764ad" transform="translate(550.977199 454.135469)">Fiber / tendon equilibrium</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'Arial'; fill: #7952a8" transform="translate(953.819677 434.73625)">Trunk motion balance</text>
    <text style="font-size: 13px; font-family: 'Arial'; fill: #7952a8" transform="translate(897.216865 453.043906)">States driven by the SAME tendon forces</text>
   </g>
