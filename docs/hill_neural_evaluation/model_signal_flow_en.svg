   <g id="text_9">
    <text style="font-size: 13px; font-family: 'Arial'; fill: #79879a" transform="translate(968.75749 160.463594)">Known load m(t)</text>
    <text style="font-size: 13px; font-family: 'Arial'; fill: #79879a" transform="translate(936.73788 179.983906)">Gravity, damping, soft limits</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #79879a" x="860.908743" y="226.8" transform="rotate(-0 860.908743 226.8)">Tonic load compensation</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #d65b22" transform="translate(857.30012 253.699219)">Predicted angle / speed</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #d65b22" transform="translate(857.30012 266.76)">modify excitation</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #18847a" x="67.011737" y="566.7264" transform="rotate(-0 67.011737 566.7264)">Angle changes lengths; muscle forces drive angle</text>
   </g>
   <g id="text_13">
    <text style="font-size: 13px; font-family: 'Arial'; fill: #24354a" transform="translate(517.921904 584.043656)">Outputs: angle, back torque, abdominal torque</text>
    <text style="font-size: 13px; font-family: 'Arial'; fill: #24354a" transform="translate(556.41206 603.556859)">Net Hill torque = back - abdomen</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 23px; font-family: 'Arial'; text-anchor: start; fill: #24354a" x="58.32" y="36" transform="rotate(-0 58.32 36)">Selected model: EMG-informed excitation control + coupled Hill mechanics</text>
  </g>
  <g id="text_15">
   <text style="font-size: 14px; font-family: 'Arial'; text-anchor: start; fill: #79879a" x="58.32" y="72" transform="rotate(-0 58.32 72)">One fixed vector per source over nine cases; no motion reference enters the solver</text>
  </g>
  <g id="text_16">
   <text style="font-size: 12px; font-family: 'Arial'; fill: #79879a" transform="translate(58.32 665.9775)">Intent uses EMG history and known load. Standing control acts through muscle excitation; no external PD torque.</text>
   <text style="font-size: 12px; font-family: 'Arial'; fill: #79879a" transform="translate(58.32 684)">Original Scale is used for offline calibration/evaluation and initial standing pose; no physiological validation is implied.</text>
  </g>
 </g>
